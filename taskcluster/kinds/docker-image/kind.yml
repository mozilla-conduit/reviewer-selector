---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.docker_image:transforms
    - taskgraph.transforms.cached_tasks:transforms
    - taskgraph.transforms.task_context
    - taskgraph.transforms.task:transforms
    # Needs to be after the task transforms.
    - reviewer_selector_taskgraph.transforms.docker-image

#kind-dependencies:
#  - lint
#  - test

index:
  product: reviewer-selector

task-defaults:
  task-context:
    from-parameters:
      channel: channel
      head_rev: head_rev
      head_ref: head_ref
      head_repository: head_repository
  run-on-tasks-for:
    - github-pull-request
    - github-push

tasks:
  reviewer-selector: {}
