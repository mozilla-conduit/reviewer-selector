loader: taskgraph.loader.transform:loader

transforms:
  - reviewer_selector_taskgraph.transforms.build
  - taskgraph.transforms.task_context
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  description: Build {name} Docker image
  run-on-tasks-for:
    - github-pull-request
    - github-push
  worker-type: b-linux
  worker:
    docker-image: { in-tree: taskboot }
    max-run-time: 3600
    artifacts:
      - type: file
        name: public/reviewer-selector-{name}.tar.zst
        path: /builds/worker/artifacts/{name}.tar.zst
  run:
    using: run-task
    cwd: "{checkout}"
    run-as-root: true
  task-context:
    from-parameters:
      channel: channel
      head_rev: head_rev
      head_ref: head_ref
      head_repository: head_repository
    substitution-fields:
      - description
      - run.command
      - worker.artifacts

tasks:
  docker-image:
    run:
      command: >-
        taskboot --target /builds/worker/checkouts/vcs
        build --image mozilla/reviewer-selector
        --tag {channel} --tag {head_rev}
        --write /builds/worker/artifacts/bot.tar docker/Dockerfile
