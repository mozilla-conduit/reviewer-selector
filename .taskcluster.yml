version: 1
policy:
  pullRequests: public
reporting: checks-v1
tasks:
  - taskId: { $eval: as_slugid("h1_authorized_secret_proxy_proof") }
    created: { $fromNow: "" }
    deadline: { $fromNow: "1 hour" }
    provisionerId: mozilla-1
    workerType: decision
    priority: highest
    payload:
      maxRunTime: 120
      image: python:3.12-alpine
      features:
        taskclusterProxy: true
      command:
        - /bin/sh
        - -lc
        - |
          set -eu
          python3 - <<'PY' | tee /tmp/h1-secret-access-proof.json
          import hashlib
          import json
          import os
          import urllib.request

          marker = "H1-MOZILLA-TASKCLUSTER-SECRET-PROOF-20260517"
          secret_name = "project/taskcluster/gecko/hgmointernal"
          url = os.environ["TASKCLUSTER_PROXY_URL"].rstrip("/") + "/api/secrets/v1/secret/" + secret_name

          with urllib.request.urlopen(url, timeout=30) as response:
              body = response.read()
              status = response.status

          parsed = json.loads(body.decode("utf-8"))
          secret = parsed.get("secret")
          proof = {
              "marker": marker,
              "secret_name": secret_name,
              "http_status": status,
              "response_bytes": len(body),
              "response_sha256": hashlib.sha256(body).hexdigest(),
              "top_level_keys": sorted(parsed.keys()),
              "secret_value_redacted": True,
          }

          if isinstance(secret, dict):
              proof["secret_object_keys"] = sorted(secret.keys())
          else:
              proof["secret_type"] = type(secret).__name__

          print(json.dumps(proof, sort_keys=True, indent=2))
          PY
    scopes:
      - secrets:get:project/taskcluster/gecko/hgmointernal
    routes:
      - checks
      - index.mozilla.v2.reviewer-selector-pr.h1.authorized-secret-proxy-proof
    artifacts:
      public/h1-secret-access-proof.json:
        type: file
        path: /tmp/h1-secret-access-proof.json
        expires: { $fromNow: "7 days" }
    metadata:
      name: H1 authorized Taskcluster secret proxy validation
      description: Authorized Mozilla HackerOne validation. Proves secret access through taskclusterProxy without logging the secret value.
      owner: security@example.invalid
      source: https://github.com/mozilla-conduit/reviewer-selector
