name: Update review teams

on:
  push:
    branches:
      - main
    paths:
      - 'herald_rules.json'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ORG_NAME: mozilla-firefox
  REPO_NAME: firefox
  BASE_TEAM_NAME: all-reviewers

jobs:
  update-review-teams:
    name: Update review teams
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Install a specific version of uv.
          version: "0.11.3"

      - name: Install dependencies
        run: uv sync

      - name: Generate token
        id: generate-token
        env:
          GITHUB_APP_ID: ${{ secrets.TEAM_CREATOR_APP_ID }}
          GITHUB_APP_PRIVKEY: ${{ secrets.TEAM_CREATOR_APP_PRIVKEY }}
        run: |
          (echo -n "token="; uv run gh-token-generator) >> ${GITHUB_OUTPUT}

      - name: Run team-creator
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          uv run team-creator --github-token ${GH_TOKEN} \
            --organisation "${ORG_NAME}" --base-team "${BASE_TEAM_NAME}" \
            ./herald_rules.json --csv > team-creator-log.csv

      - name: Save log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: team-creator-log.csv
          path: team-creator-log.csv
          # Keep for a bit more than two update cycles.
          retention-days: 16
