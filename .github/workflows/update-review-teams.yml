name: Update review teams

on:
  push:
    branches:
      - main
    paths:
      - 'herald_rules.json'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ORG_NAME: mozilla-firefox
  REPO_NAME: firefox
  BASE_TEAM_NAME: all-reviewers

jobs:
  update-review-teams:
    name: Update review teams
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.11.3"

      - name: Install dependencies
        run: uv sync

      - name: Generate token
        id: generate-token
        env:
          GITHUB_APP_ID: ${{ secrets.TEAM_CREATOR_APP_ID }}
          GITHUB_APP_PRIVKEY: ${{ secrets.TEAM_CREATOR_APP_PRIVKEY }}
        run: |
          (echo -n "token="; uv run gh-token-generator) >> ${GITHUB_OUTPUT}

      - name: Run team-creator
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          uv run team-creator --github-token ${GH_TOKEN} \
            --organisation "${ORG_NAME}" --base-team "${BASE_TEAM_NAME}" \
            ./herald_rules.json --csv > team-creator-log.csv

      - name: Save log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: team-creator-log.csv
          path: team-creator-log.csv
          # Keep for a bit more than two update cycles.
          retention-days: 16
